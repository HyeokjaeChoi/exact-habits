name: test

# Unit tests and repo rules (rules.test.ts). `bun exact.mjs test web` in CI is a follow-up:
# it needs a pinned checkout of expo/exact.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun test
