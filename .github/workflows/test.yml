name: test

# `scripts/gate.sh ci`: the oxfmt check, oxlint, unit tests and repo rules (rules.test.ts).
# `contract fmt --check` and `bun exact.mjs test web` in CI are a follow-up:
# they need a checkout of expo/exact at the commit in `.exact-commit`.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: scripts/gate.sh ci
