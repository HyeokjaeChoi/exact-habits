name: ai-review

# Deep AI review (Claude Opus 5.5, xhigh effort). It does not run on every push: it runs only when the
# `ai-review-request` label is added to a PR. The workflow removes the label when it finishes, so adding it
# again asks for a new review.
#
# What it does (details in REVIEW.md and .github/review/review.py):
# 1. Collect context without any key: PR, linked issues, history of the changed files and the review threads on the
#    PRs they came from, earlier AI findings on this PR, base versions of SPEC.md and docs.
# 2. Reviewer pass: checks the requirements the PR claims, traces the changed code, history and fit. Read-only tools.
# 3. Verifier pass: fresh context, tries to refute every candidate. Only confirmed findings are posted inline.
# 4. Post job (no key, no model): validates, redacts, posts the summary and the inline comments.
# Credentials: ANTHROPIC_API_KEY (API credits) first; CLAUDE_CODE_OAUTH_TOKEN (subscription) only for no-key or
# quota. The model has no shell and never posts. The review is advisory and is not a required check.
# Every finding carries a hidden marker; .github/workflows/ai-review-learn.yml learns from how people answer them.

on:
  pull_request:
    types: [labeled]

concurrency:
  # One group per label: other labels do not cancel a running review.
  group: ai-review-${{ github.event.pull_request.number }}-${{ github.event.label.name }}
  cancel-in-progress: true

permissions: {}

jobs:
  review:
    # Fork PRs get no secrets, so they are skipped.
    if: >-
      github.event.label.name == 'ai-review-request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Read only, on purpose: the key and the model live here.
    permissions:
      contents: read
      pull-requests: read
      issues: read
    env:
      PR: ${{ github.event.pull_request.number }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Same tree as the inline comment anchor (head SHA).
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .review-base
          persist-credentials: false
      # The review rules and scripts come from the PR base, never from the PR head: a PR cannot change its own reviewer.
      # `.claude/`, CLAUDE.md and .mcp.json can run hooks or MCP servers with the key in the environment, so the head
      # versions are removed and the base versions put in place.
      - name: Review configuration from the PR base
        run: |
          rm -rf REVIEW.md CLAUDE.md .claude .mcp.json .github/review
          for p in REVIEW.md CLAUDE.md .claude .mcp.json .github/review; do
            if [ -e ".review-base/$p" ]; then mkdir -p "$(dirname "$p")"; cp -R ".review-base/$p" "$p"; fi
          done
          git status --short
      - name: Install Claude Code CLI
        working-directory: ${{ runner.temp }}
        run: npm install -g @anthropic-ai/claude-code >/dev/null
      # No key here: GH_TOKEN is read only.
      - name: Collect context
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: python3 .review-base/.github/review/review.py collect --out .review-context
      # The key is in this step only. GH_TOKEN is not.
      - name: Review and verify
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python3 .review-base/.github/review/review.py run --context .review-context --out "$RUNNER_TEMP/out" --sha "$HEAD_SHA"
      - uses: actions/upload-artifact@v7
        with:
          name: review-out
          path: ${{ runner.temp }}/out
          if-no-files-found: error
          retention-days: 14

  post:
    # Writes the review. No model and no key here.
    needs: review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    env:
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: review-out
          path: ${{ runner.temp }}/out
      - name: Post the review
        run: python3 .github/review/review.py post --review "$RUNNER_TEMP/out/review.json" --pr "$PR" --sha "$HEAD_SHA"

  label:
    # Whatever happened, take the label off so the next request starts a new run. A cancelled run (replaced by a new
    # request) must not remove the new request's label.
    needs: [review, post]
    if: >-
      ${{ !cancelled() && github.event.label.name == 'ai-review-request' &&
      github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/labels/ai-review-request" >/dev/null 2>&1 || true
