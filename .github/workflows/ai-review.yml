name: ai-review

# Deep AI review (Claude Opus 5.5, xhigh effort). It does not run on every push: it runs only when the
# `ai-review-request` label is added to a PR. The workflow removes the label when it finishes,
# so adding it again asks for a new review.
#
# Stage 1: `claude -p` with ANTHROPIC_API_KEY (Console API credits).
# Stage 2: only if stage 1 failed and no summary comment exists yet, claude-code-action with
#          CLAUDE_CODE_OAUTH_TOKEN (subscription quota). A marker in the summary comment prevents duplicate reviews.
# The review is advisory and is not a required check.

on:
  pull_request:
    types: [labeled]

concurrency:
  # One group per label: other labels do not cancel a running review.
  group: ai-review-${{ github.event.pull_request.number }}-${{ github.event.label.name }}
  cancel-in-progress: true

jobs:
  review:
    # Fork PRs get no secrets, so they are skipped.
    if: >-
      github.event.label.name == 'ai-review-request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: read
      statuses: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
      MARKER: "<!-- ai-review:${{ github.event.pull_request.head.sha }} -->"
      PROMPT: |
        REPO: ${{ github.repository }}
        PR NUMBER: ${{ github.event.pull_request.number }}
        HEAD SHA: ${{ github.event.pull_request.head.sha }}

        Review this PR in depth. The PR branch is checked out with full history.
        Do not look at the diff alone: judge whether the change is right for the whole app and codebase.

        Gather context first:
        - `gh pr view --json title,body,closingIssuesReferences,files` and `gh pr diff`: description, linked issues, changes
        - `gh issue view <n> --json title,body,comments`: requirements and decisions in linked issues
        - AGENTS.md, SPEC.md, GLOSSARY.md and docs/adr/* (if present): ownership of files, the seam, domain and architecture decisions
        - app.contract, app.ts, streak.ts, app.test.contract, app.json: the surrounding code of every changed file and its callers
        - `git log` and `git blame` for the intent of earlier changes
        - `gh pr list --state merged --search <keyword>` for related past PRs when useful

        Criteria, in priority order:
        1. Correctness bugs (null, boundaries, date and timezone handling in streak math, state, race conditions, wrong conditions)
        2. Changes to the seam in SPEC.md ("Seam (do not change)": routes, shapes, fns, resource and mutation lines, listed actions)
        3. Conflicts with earlier decisions (SPEC.md, ADRs), or a reversal that needs a doc update
        4. File ownership violations (UI in app.contract, data in app.ts and streak.ts, tests in app.test.contract)
        5. Cross-platform problems (web, iOS, macOS, Android) and accessibility
        6. Duplicated logic or missed reuse of existing helpers
        7. Missing tests (only when branching logic has none)

        Do not comment on style or taste. Only raise findings with a concrete failure scenario or a reference document (path).
        Write the overall summary in Korean with `gh pr comment`, exactly once, and the first line of the body must be
        `<!-- ai-review:${{ github.event.pull_request.head.sha }} -->`. If there are no issues, write "특이사항 없음" in the summary.
        List the context you checked (documents, issues, PRs) briefly in the summary.
        Leave results only as GitHub comments; do not print the review body as a message.

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Same tree as the inline comment anchor (head SHA).
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Review (API credits, claude -p)
        id: api
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          test -n "$ANTHROPIC_API_KEY" || { echo "::warning::ANTHROPIC_API_KEY not set"; exit 1; }
          npm install -g @anthropic-ai/claude-code >/dev/null
          INLINE="Leave code problems as line comments (in Korean):
          gh api repos/${GITHUB_REPOSITORY}/pulls/${PR}/comments -f commit_id=${SHA} -f path=<file> -F line=<line in the new file> -f side=RIGHT -f body=<text>"
          claude -p "${PROMPT}
          ${INLINE}" \
            --model claude-opus-5-5 \
            --effort xhigh \
            --max-turns 80 \
            --allowedTools "Read,Grep,Glob,Bash(git log:*),Bash(git show:*),Bash(git blame:*),Bash(git diff:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh api repos/${GITHUB_REPOSITORY}/pulls/${PR}/comments:*)" \
            --output-format json > result.json || true
          jq '{is_error, subtype, num_turns, total_cost_usd, result: (.result // "" | .[0:300])}' result.json || cat result.json
          jq -e '.is_error == false' result.json >/dev/null

      - name: Check summary posted
        id: posted
        if: always()
        run: |
          n=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
            --jq "[.[] | select(.body | contains(\"${MARKER}\"))] | length" | awk '{s+=$1} END {print s+0}')
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "summary comments for ${SHA}: $n"

      - name: Review (subscription fallback)
        if: steps.api.outcome == 'failure' && steps.posted.outputs.count == '0'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            ${{ env.PROMPT }}
            Leave code problems with mcp__github_inline_comment__create_inline_comment (confirmed: true), in Korean.
            Stage 1 may have failed midway. First read the line comments already on this HEAD SHA with
            `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments` and do not repeat the same finding.
          claude_args: >-
            --model claude-opus-5-5
            --effort xhigh
            --max-turns 80
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(git log:*),Bash(git show:*),Bash(git blame:*),Bash(git diff:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments:*)"

      - name: Remove trigger label
        # A cancelled run (replaced by a new request) must not remove the new request's label.
        if: ${{ !cancelled() }}
        run: |
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/issues/${PR}/labels/ai-review-request" >/dev/null 2>&1 || true
          if gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/labels" --jq '.[].name' | grep -qx ai-review-request; then
            echo "::error::ai-review-request label still present"; exit 1
          fi
